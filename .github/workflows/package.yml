name: Antitotem — build & package

# Builds the Antitotem standalone instrument and generates a platform
# package on each of GitHub's own hosted runners - real Windows and macOS
# toolchains, no local Windows/Mac machine needed. Adapted from the
# workflow that lived in the rasgo-instruments monorepo when this project
# was extracted into its own public repository (27 ago. 2026).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: DEB
            artifact-glob: build/*.deb
          - os: windows-latest
            generator: NSIS
            artifact-glob: build/*.exe
          - os: macos-latest
            generator: DragNDrop
            artifact-glob: build/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Antitotem
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: master
          path: JUCE-checkout

      # JUCE's own documented Linux build dependencies (audio, GUI, font,
      # network, webview) - trimmed of nothing, since a missing dev package
      # fails CMake configure with a hard-to-read error. Windows (MSVC) and
      # macOS (Xcode) runners already ship everything JUCE needs.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libglu1-mesa-dev mesa-common-dev

      # makensis is not on the Windows runner's PATH by default; Chocolatey
      # is preinstalled there.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DANTITOTEM_JUCE_PATH=${{ github.workspace }}/JUCE-checkout

      - name: Build
        run: cmake --build build --target AntitotemSimpleSequencerApp --config Release --parallel

      # No Mac available to test by hand, so this replaces that: fails the
      # build if the .app isn't actually distributable (Universal 2
      # architecture, a real deployment target, not the CI runner's own
      # macOS version - see docs/TAREFAS.md for the bug this caught live).
      - name: Validate macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=$(find build -maxdepth 6 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          echo "App bundle: $APP"
          EXE="$APP/Contents/MacOS/Antitotem - Objeto Sonoro"

          echo "--- file (architecture) ---"
          file "$EXE"
          if ! file "$EXE" | grep -q "Mach-O universal binary with 2 architectures"; then
            echo "::error::Expected a Universal 2 (x86_64+arm64) binary"; exit 1
          fi
          if ! (lipo -info "$EXE" | grep -q "x86_64" && lipo -info "$EXE" | grep -q "arm64"); then
            echo "::error::Missing x86_64 or arm64 slice"; exit 1
          fi

          echo "--- otool -l (deployment target) ---"
          otool -l "$EXE" | grep -A4 "LC_BUILD_VERSION\|LC_VERSION_MIN_MACOSX"
          MINOS=$(otool -l "$EXE" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "minos=$MINOS"
          if [[ "$MINOS" == 2[0-9].* ]]; then
            echo "::error::minos $MINOS looks like it defaulted to the runner's own macOS version, not the project's deployment target"
            exit 1
          fi

          echo "--- plutil (Info.plist) ---"
          plutil -p "$APP/Contents/Info.plist"

          echo "--- codesign (ad-hoc; no Developer ID/notarization in CI) ---"
          codesign -dv "$APP" 2>&1 || echo "::warning::Not signed - fine for local testing, but real distribution needs a Developer ID + notarization or Gatekeeper will show an unidentified-developer warning on first launch"

      - name: Package
        working-directory: build
        run: cpack -G ${{ matrix.generator }} -C Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: antitotem-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
